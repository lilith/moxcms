name: ASM + unsafe audits

# Two gates that catch regressions in codegen quality and `unsafe` usage:
#
#   * `ci/asm-audit.sh <scenario>` builds the crate with `--features options`
#     and asserts every questioned interpolator type emits zero
#     `panic_bounds_check`, plus a whole-crate per-symbol baseline so a
#     regression inlined into a caller can't slip past the per-type grep.
#
#   * `ci/unsafe-audit.sh` counts `unsafe` tokens per `.rs` file under
#     `src/` against a pinned per-file baseline. Monotonic reduction only;
#     an intentional rise requires bumping the baseline in the PR.
#
# Lives in the fork (lilith/moxcms) — the `if:` guard stops it from firing
# upstream if the workflow file ever lands on awxkee/moxcms.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - 'safe-bary-*'
      - 'asm-audit-*'
      - 'magetypes-*'
      - 'apr16-unsafe-reduction'
  pull_request:
    branches:
      - 'master'
  workflow_dispatch:

jobs:
  asm-audit:
    name: asm-audit (${{ matrix.scenario }})
    if: github.repository == 'lilith/moxcms'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [x86, aarch64]
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Install aarch64 target
        if: matrix.scenario == 'aarch64'
        run: rustup target add aarch64-unknown-linux-gnu

      - name: Install cargo-show-asm
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-show-asm

      - name: Run asm audit
        run: ci/asm-audit.sh ${{ matrix.scenario }}

      - name: Upload asm artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asm-audit-${{ matrix.scenario }}
          path: target/asm-audit/${{ matrix.scenario }}
          if-no-files-found: error

  unsafe-audit:
    name: unsafe-audit
    if: github.repository == 'lilith/moxcms'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run unsafe audit
        run: ci/unsafe-audit.sh

      - name: Upload unsafe audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unsafe-audit
          path: target/unsafe-audit
          if-no-files-found: ignore

  coverage:
    name: coverage
    # Coverage makes the asm + unsafe audits meaningful. A file can have
    # zero `panic_bounds_check` in its compiled asm simply because the
    # test suite never exercises it. The coverage job runs the full test
    # matrix under `cargo-llvm-cov`, emits an lcov report, and prints a
    # per-file summary — the `trc::lut_interp_tests` and the various
    # `Lut4x3` / transform paths the audit pins should show non-zero
    # coverage here. A coverage floor can be introduced later once the
    # organic numbers settle.
    if: github.repository == 'lilith/moxcms'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Run tests under coverage (all features)
        run: |
          cargo llvm-cov --all-features --lcov --output-path lcov.info
          echo
          echo "::group::per-file coverage summary (all features)"
          cargo llvm-cov report
          echo "::endgroup::"

      - name: Upload lcov.info
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error

      - name: Spot-check audited paths
        # The asm and unsafe audits pin baselines for specific files. If
        # any of those files is 0%-covered by the test suite, the baseline
        # is guarding codegen for code that never runs — a regression
        # there wouldn't be caught by `cargo test`. Surface this as a
        # warning so it's visible in PR CI without blocking; add tests
        # that exercise those paths to make the audit load-bearing.
        run: |
          set -eu
          report=$(cargo llvm-cov report 2>&1)
          uncovered=0
          for f in \
            src/trc.rs \
            src/conversions/lut4.rs \
            src/conversions/lut3x3.rs \
            src/conversions/lut3x4.rs \
            src/conversions/interpolator.rs \
            src/nd_array.rs \
          ; do
            # cargo-llvm-cov emits rows relative to src/ root, e.g.
            # `trc.rs`, `conversions/lut4.rs`. Exact-match the first
            # column to avoid false positives (e.g. `trc.rs` substring-
            # matching `srlab2.rs`).
            relpath="${f#src/}"
            pct=$(printf '%s\n' "$report" \
                    | awk -v p="$relpath" '$1 == p { print $4; exit }' \
                    | tr -d '%')
            if [ -z "$pct" ] || [ "${pct%.*}" = 0 ]; then
              echo "::warning file=$f::$f has 0% region coverage — asm/unsafe baselines here are for untested code paths; add tests to make the audit load-bearing"
              uncovered=$((uncovered + 1))
            else
              echo "$f: $pct% region coverage"
            fi
          done
          echo "spot-check: $uncovered audited file(s) lack coverage"
